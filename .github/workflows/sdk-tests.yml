name: SDK Tests

on:
  push:
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-tests.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-tests.yml'
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python SDK self-test
        run: python3 sdk/python/test_sdk.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go SDK tests
        run: cd sdk/go && go vet ./... && go test ./... -v

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Java SDK tests
        run: cd sdk/java/activation-manager && mvn -B test

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, hash, json
      - name: Run PHP SDK self-test
        run: php sdk/php/test_sdk.php

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Run Ruby SDK self-test
        run: ruby sdk/ruby/test_sdk.rb

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl-dev
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build and run C SDK test
        run: |
          cd sdk/c
          cc -std=c11 -DAM_HAVE_OPENSSL -c activation_manager.c -I/usr/include -o am.o
          cc -std=c11 -DAM_HAVE_OPENSSL test_client.c am.o -lssl -lcrypto -lcurl -o test_client
          python3 test_server.py 18971 &
          sleep 1
          ./test_client "http://127.0.0.1:18971"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl-dev
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build and run C++ SDK test
        run: |
          cd sdk/cpp
          c++ -std=c++17 -DAM_HAVE_OPENSSL test_client.cpp -lssl -lcrypto -lcurl -o test_client
          python3 ../c/test_server.py 18975 &
          sleep 1
          ./test_client "http://127.0.0.1:18975"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck standalone TS copy
        run: |
          npm install -g typescript@5.6
          cd sdk/typescript
          tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution bundler --lib ES2020,DOM,DOM.Iterable license-sdk.ts

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift SDK
        run: cd sdk/swift && swift build

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5'
      - name: Run Dart SDK tests
        run: |
          cd sdk/dart
          dart pub get
          dart analyze
          dart test

  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Scala SDK test
        run: |
          cd sdk/scala
          curl -sL "https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz" | gzip -d > scala-cli
          chmod +x scala-cli
          ./scala-cli run --server=false test_sdk.scala

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Perl SDK self-test
        run: |
          cd sdk/perl
          perl -c ActivationManager.pm
          perl test_sdk.pl

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks install dkjson
          sudo luarocks install luasocket
      - name: Run Lua SDK syntax + smoke test
        run: |
          cd sdk/lua
          export LUA_PATH="/usr/local/share/lua/5.4/?.lua;/usr/local/share/lua/5.4/?/init.lua;/usr/local/lib/lua/5.4/?.lua;$(luarocks path --lua-version 5.4 2>/dev/null | grep LUA_PATH | sed 's/^.*LUA_PATH="//;s/".*$//');./?.lua;;"
          export LUA_CPATH="/usr/local/lib/lua/5.4/?.so;;"
          lua5.4 -e "local am=require('activation_manager'); print('lua sdk loaded OK')"

  groovy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Groovy SDK syntax + compile check
        run: |
          cd sdk/groovy
          curl -sL "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-4.0.24.zip" -o groovy.zip ||             curl -sL "https://archive.apache.org/dist/groovy/4.0.24/distribution/apache-groovy-binary-4.0.24.zip" -o groovy.zip
          unzip -q groovy.zip
          find . -maxdepth 1 -type d -name "apache-groovy-*" | head -1 | xargs -I{} {}/bin/groovyc ActivationManagerClient.groovy

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run C# SDK test
        run: |
          cd sdk/csharp
          dotnet build -v q
          dotnet test -v q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust SDK tests
        run: cd sdk/rust && cargo test --release

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin toolchain via Maven
        run: cd sdk/kotlin && mvn -B test
