services:
  activation-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-xdlee/activation-manager:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 中配置 JWT_SECRET}
      ALLOWED_IPS: ${ALLOWED_IPS:-127.0.0.1,::1,172.16.0.0/12}
      # 仅首次初始化（数据库中无管理员）时需要；已有管理员的存量库可不设置
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # 无 HTTPS 反代时设为 false，否则浏览器拒收 Secure cookie 导致登录死循环
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - activation_manager_data:/app/data

volumes:
  activation_manager_data:
